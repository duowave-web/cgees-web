     no van. Para el logo completo, assets/img/logo.svg. -->
<circle cx="256" cy="256" r="256" fill="#D60A07"/>
<circle cx="256" cy="256" r="188.4" fill="#FCC803"/>
<circle cx="256" cy="256" r="149.3" fill="#37960E"/>
</svg>
