<svg xmlns="http://www.w3.org/2000/svg" viewBox="124 102 152 196" width="152" height="196" role="img" aria-labelledby="cgeMarcaTitulo">
  <title id="cgeMarcaTitulo">CGE-ES</title>

  <!--
    Marca compacta para tamaños pequeños (cabecera en móvil, iconos).
    Es el mismo escudo del logo completo, recortado: a 44 px el anillo
    exterior y el texto circular se convierten en una mancha ilegible,
    así que aquí se quedan fuera y el mapa de Guinea gana tamaño.
  -->

  <defs>
    <path id="mGuinea" d="M 0,32.7 L 14.7,21.8 L 18.7,9.1 L 28,0.4 L 37.3,5.5 L 49.3,5.5 L 58.7,14.5
                          L 69.3,9.1 L 78.7,12.7 L 89.3,30.9 L 92,41.8 L 96,56.4 L 98.7,69.1
                          L 92,78.2 L 89.3,90.9 L 81.3,98.2 L 76,85.5 L 69.3,76.4 L 60,74.5
                          L 52,67.3 L 43,56 L 29.3,61.8 L 24,67.3 L 18.7,56.4 L 9.3,43.6 Z"/>

    <path id="mEspana" d="M 2.4,7.7 L 18.3,2.6 L 38.1,5.1 L 57.9,5.1 L 59.7,5.4 L 79.4,14.1 L 85.7,17.9
                          L 99.2,17.9 L 81,35.9 L 73.8,50 L 71.4,56.4 L 75.4,64.1 L 68.3,79.5
                          L 59.5,84.6 L 50,91 L 38.9,91 L 29.4,100 L 23.8,89.7 L 15.1,84.6
                          L 18.3,71.8 L 15.9,55.1 L 19,44.9 L 19.8,35.9 L 24.6,28.2 L 21.4,23.1
                          L 8.7,23.1 L 3.2,15.4 Z"/>

    <path id="mEscudo" d="M 130,120 a 12,12 0 0 1 12,-12 h 116 a 12,12 0 0 1 12,12
                          v 78 c 0,52 -40,78 -70,94 c -30,-16 -70,-42 -70,-94 Z"/>

    <clipPath id="mRecorteGuinea"><use href="#mGuinea" transform="translate(150 134) scale(1 0.78)"/></clipPath>
    <clipPath id="mRecorteEscudo"><use href="#mEscudo"/></clipPath>
  </defs>

  <use href="#mEscudo" fill="#FFFFFF" stroke="#FCD116" stroke-width="7"/>

  <g clip-path="url(#mRecorteEscudo)">
    <use href="#mEspana" transform="translate(163 224) scale(0.74 0.6)" fill="#E6E6E6"/>
  </g>

  <g clip-path="url(#mRecorteGuinea)">
    <rect x="150" y="134" width="33.4" height="78" fill="#CE1126"/>
    <rect x="183.4" y="134" width="33.4" height="78" fill="#FCD116"/>
    <rect x="216.8" y="134" width="33.4" height="78" fill="#009E49"/>
  </g>

  <use href="#mEscudo" fill="none" stroke="#1F2A37" stroke-width="2"
       transform="translate(200 200) scale(0.94) translate(-200 -200)"/>
</svg>
